<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Favors | Page Not Found</title>
  <meta name="theme-color" content="#2C1E21">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo"><img src="assets/images/aura-logo.svg" alt="Aura Favors"></a>
      <div class="nav-actions">
        <button class="rtl-toggle" aria-label="Toggle text direction"></button>
        <a href="enquire.html" class="btn btn-sm btn-outline desk-only">Enquire</a>
        <button class="theme-toggle" aria-label="Toggle dark mode"><i class="ph ph-moon"></i></button>
      </div>
    </div>
  </header>

  <main class="error-page" style="padding: var(--space-16) 0; text-align: center;">
    <div class="container">
      <span class="eyebrow centered animate-fade-in">Error 404</span>
      <div class="error-code animate-fade-in delay-1" style="font-family:var(--font-display); font-size:6rem; font-weight:700; color:var(--color-accent); margin:var(--space-2) 0;">404</div>
      <h1 class="animate-fade-in delay-1">Page Not Found</h1>
      <p class="subtext animate-fade-in delay-2">
        The page you are looking for may have moved or changed name.
        Our wedding favor collections and custom gift studio are ready to explore.
      </p>
      <div class="hero-actions animate-fade-in delay-3" style="justify-content:center; gap:var(--space-3); margin-top:var(--space-5);">
        <a href="index.html" class="btn btn-primary">Return Home</a>
        <a href="shop.html" class="btn btn-outline">Explore Products</a>
        <a href="enquire.html" class="btn btn-accent">Custom Enquiry</a>
      </div>
    </div>
  </main>
  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up"></i></button>

  <script src="assets/js/main.js"></script>
</body>
</html>
