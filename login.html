<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Favors | Client Portal Login</title>
  <meta name="description" content="Sign in to your Aura Favors client portal account.">
  <meta name="theme-color" content="#2C1E21">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>

  <!-- main.js binds these by class, exactly as it does in the navbar -->
  <div class="auth-controls">
    <button class="rtl-toggle" aria-label="Toggle text direction"></button>
    <button class="theme-toggle" aria-label="Toggle dark mode"></button>
  </div>

  <div class="auth-layout">
    <div class="auth-box animate-fade-in">
      <a href="index.html" class="logo" style="display:inline-block; margin-bottom: var(--space-5);"><img src="assets/images/aura-logo.svg" alt="Aura Favors"></a>
      <h1>Client Portal Login</h1>
      <p class="subtext">Sign in to access custom favor proofs, bulk order status, and sample kit tracking.</p>

      <form data-validate="true" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
          <span class="error-msg">This field is required</span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"><i class="ph ph-eye"></i></button>
          </div>
          <span class="error-msg">This field is required</span>
        </div>

        <div class="auth-aside">
          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Remember me</label>
          </div>
          <a href="#" class="link-underline">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Sign In</button>
      </form>

      <div class="auth-separator"><span>Or continue with</span></div>

      <button class="btn btn-google">
        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)"><path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/><path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/><path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/><path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/></g></svg>
        Google
      </button>

      <button class="btn btn-apple">
        <svg class="apple-icon" viewBox="0 0 170 170" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.33.13-9.13-1.9-14.38-6.08-3.48-2.84-7.39-7.58-11.75-14.23-6.28-9.63-11.16-20.09-14.65-31.39-3.48-11.3-5.22-22.18-5.22-32.65 0-15.64 4.07-28.53 12.22-38.67 8.14-10.14 18.39-15.34 30.74-15.6 4.71 0 9.87 1.15 15.48 3.45 5.61 2.3 9.4 3.45 11.37 3.45 1.6 0 5.48-1.2 11.64-3.6 6.16-2.4 11.36-3.48 15.6-3.24 10.37.52 18.87 4.3 25.5 11.33-14.28 8.63-21.28 20.65-21.01 36.07.27 12.03 4.88 22.1 13.84 30.2 4.12 3.73 8.87 6.47 14.25 8.22-2.82 8.44-6.66 16.92-11.52 25.43zM119.22 31.08c0-7.35 2.65-14.4 7.95-21.14 5.3-6.74 11.96-10.59 19.98-11.55.13 1.05.2 1.84.2 2.36 0 7.35-2.73 14.47-8.19 21.36-5.46 6.89-12.16 10.82-20.1 11.79-.13-.91-.2-1.85-.2-2.82z"/></svg> Apple
      </button>

      <p class="auth-footnote">
        New to Aura Favors? <a href="register.html" class="link-underline">Create client account</a>
      </p>
    </div>
  </div>
  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up"></i></button>

  <script src="assets/js/main.js"></script>
</body>
</html>
